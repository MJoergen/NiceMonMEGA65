# make typecheck: mypy --strict on the Python tools and scripts, as
# nice_cpu's make typecheck does on its own (CONTRIBUTING.md).
[mypy]
strict = True
files = tools, demo, font, sim/gen_decode.py, monitor/test/ring.py
# nice_cpu's disassembler, which mon.py, screenshot.py, and gen_decode.py
# import from there
mypy_path = nice_cpu/assembler

# pyftdi, for spiflash.py, has no types, and need not be installed
[mypy-pyftdi.*]
ignore_missing_imports = True
