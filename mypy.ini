# make typecheck: mypy --strict on the Python tools and scripts, as
# nice_cpu's make typecheck does on its own (CONTRIBUTING.md).
[mypy]
strict = True
files = tools, demo, font, sim/gen_decode.py, monitor/test/ring.py, monitor/test/dis.py, monitor/test/sd_image.py, monitor/test/dhcp.py, monitor/test/fat_image.py, monitor/test/fat_check.py, monitor/test/tftp.py, monitor/test/rtc.py
# nice_cpu's disassembler, which screenshot.py and gen_decode.py import,
# and its debugger/, the link that boardlink.py adds the board's transports
# to, the loader, and the debugger that mon.py runs
mypy_path = nice_cpu/assembler:nice_cpu/debugger

# pyftdi, for spiflash.py, has no types, and need not be installed
[mypy-pyftdi.*]
ignore_missing_imports = True
