name: CI

on:
  push:
  pull_request:

jobs:
  # The GHDL tests on both cores. Ubuntu 24.04 has GHDL 4.1.0, the version
  # of README.md. niceemu is built so that check-steps compares the step
  # counts that tb_nicemon checks with the emulator.
  sim:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        nice: [pipeline, multi]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Zig 0.15 is the only version that nice_cpu supports.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: make -C nice_cpu/emulator build
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: make -C sim -j4 test NICE=${{ matrix.nice }}

  # The C examples, so that a nice_cpu bump that breaks examples/Makefile
  # shows here, not first in make hwtest. Then the host tools on niceemu
  # --link, with the benchmark among the programs.
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: make examples
      - run: make -C nice_cpu/emulator build
      - run: make linktest

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The style of CODING_STYLE.md, as far as vsg can check it.
      - run: pip install vsg==3.35.0
      - run: make lint

  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The versions of nice_cpu's formal job: Yosys 0.33 with its GHDL
      # plugin, which loads the libraries of ghdl-gcc, SymbiYosys at its tag
      # yosys-0.33, and Yices 2.6.4.
      - run: |
          sudo apt-get update
          sudo apt-get install -y yosys yosys-plugin-ghdl ghdl-gcc
      - run: |
          git clone --depth 1 --branch yosys-0.33 https://github.com/YosysHQ/sby.git /tmp/sby
          sudo make -C /tmp/sby install PREFIX=/usr/local
      - run: |
          curl -sSL https://github.com/SRI-CSL/yices2/releases/download/Yices-2.6.4/yices-2.6.4-x86_64-pc-linux-gnu.tar.gz | tar xz -C /tmp
          sudo cp /tmp/yices-2.6.4/bin/* /usr/local/bin/
      - run: make -j4 formal
