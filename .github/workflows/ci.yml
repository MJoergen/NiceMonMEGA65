name: CI

on:
  push:
  pull_request:

jobs:
  # The GHDL tests on both cores. Ubuntu 24.04 has GHDL 4.1.0, the version
  # of README.md. niceemu is built so that check-steps compares the step
  # counts that tb_nicemon checks with the emulator.
  sim:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        nice: [pipeline, multi]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The one Zig version that nice_cpu builds with, from its own CI, so
      # that a bump of the submodule brings its Zig version along.
      - id: zig
        run: |
          v=$(grep -A2 setup-zig nice_cpu/.github/workflows/ci.yml | grep -m1 -oP '^\s*version:\s*\K\S+')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - run: make -C nice_cpu/emulator build
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: make -C sim -j4 test NICE=${{ matrix.nice }}
      # The tools on the simulated system, compared with niceemu
      - run: make cosimtest NICE=${{ matrix.nice }}

  # The C examples, so that a nice_cpu bump that breaks examples/Makefile
  # shows here, not first in make hwtest. Then the host tools on niceemu
  # --link, with the benchmark among the programs.
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The Zig version of nice_cpu's CI, as in the sim job
      - id: zig
        run: |
          v=$(grep -A2 setup-zig nice_cpu/.github/workflows/ci.yml | grep -m1 -oP '^\s*version:\s*\K\S+')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - run: make examples
      - run: make -C nice_cpu/emulator build
      # The demo of the ROM, on niceemu
      - run: make -C demo test
      - run: make linktest

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The style of doc/CODING_STYLE.md, as far as vsg can check it.
      - run: pip install vsg==3.35.0
      - run: make lint

  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The tools of nice_cpu's formal job (nice_cpu/.github/workflows/ci.yml),
      # the OSS CAD Suite of 2026-09-30: Yosys 0.69 with the GHDL plugin,
      # SymbiYosys, and Yices 2.7.0. Its programs set up their own
      # environment. The digest is the one GitHub gives for the asset.
      - run: |
          curl -sSLo "$RUNNER_TEMP/oss-cad-suite.tgz" https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-30/oss-cad-suite-linux-x64-20260930.tgz
          echo "9e50078dd84062bb78b19cc27a2185b9d37f8cd3d80c03242ec6d85044895fc1  $RUNNER_TEMP/oss-cad-suite.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"
      - run: make -j4 formal
